name: Batch B EF Migration Bootstrap

on:
  push:
    branches: ['batch-b/multi-tenant-security-spine']
    paths:
      - 'src/backend/Ogfi.Modules.Foundation/**'
      - '.github/workflows/batch-b-generate-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore OGFI.sln
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Generate migration from runtime model
        run: |
          dotnet ef migrations add SecuritySpine \
            --project src/backend/Ogfi.Modules.Foundation/Ogfi.Modules.Foundation.csproj \
            --context FoundationDbContext \
            --output-dir Persistence/Migrations
      - name: Commit generated migration and exact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/Ogfi.Modules.Foundation/Persistence/Migrations
          git diff --cached --quiet && { echo 'No generated migration changes'; exit 1; }
          git commit -m "chore(batch-b): generate EF security spine migration"
          git push origin HEAD:${GITHUB_REF_NAME}
