name: Batch C Frontend Lockfile Bootstrap

on:
  push:
    branches: ['batch-c/purchasing-master-data-spine']

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/ogfi-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-c/purchasing-master-data-spine
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - name: Resolve approved frontend dependency lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/ogfi-web/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(batch-c): lock approved frontend dependencies'
          git push origin HEAD:batch-c/purchasing-master-data-spine
