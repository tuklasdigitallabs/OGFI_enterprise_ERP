name: RI-01 CI

on:
  push:
    branches: [main, 'batch-*/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ri01-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ogfi
          POSTGRES_USER: ogfi
          POSTGRES_PASSWORD: ogfi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogfi -d ogfi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=ogfi;Username=ogfi;Password=ogfi_dev
    steps:
      - uses: actions/checkout@v4
      - name: Install approved .NET SDK 10.0.400
        run: |
          mkdir -p "${RUNNER_TEMP}/dotnet"
          curl --fail --location --retry 5 --retry-all-errors \
            https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-linux-x64.tar.gz \
            -o "${RUNNER_TEMP}/dotnet-sdk.tar.gz"
          tar -xzf "${RUNNER_TEMP}/dotnet-sdk.tar.gz" -C "${RUNNER_TEMP}/dotnet"
          echo "${RUNNER_TEMP}/dotnet" >> "${GITHUB_PATH}"
          echo "DOTNET_ROOT=${RUNNER_TEMP}/dotnet" >> "${GITHUB_ENV}"
      - name: Verify approved .NET SDK
        run: |
          ACTUAL="$(dotnet --version)"
          echo "Using .NET SDK ${ACTUAL}"
          test "${ACTUAL}" = "10.0.400"
      - name: Restore
        run: dotnet restore OGFI.sln
      - name: Build
        run: dotnet build OGFI.sln --no-restore -c Release
      - name: Migrate clean database
        run: dotnet run --project src/backend/Ogfi.Migrator/Ogfi.Migrator.csproj -c Release
      - name: Test
        run: dotnet test OGFI.sln --no-build -c Release
      - name: Publish controlled backend artifacts
        run: |
          mkdir -p artifacts/backend
          dotnet publish src/backend/Ogfi.Api/Ogfi.Api.csproj --no-restore -c Release -o artifacts/backend/api
          dotnet publish src/backend/Ogfi.Workers/Ogfi.Workers.csproj --no-restore -c Release -o artifacts/backend/workers
          dotnet publish src/backend/Ogfi.Migrator/Ogfi.Migrator.csproj --no-restore -c Release -o artifacts/backend/migrator
      - name: Export OpenAPI 3.1 contract from running API
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          mkdir -p artifacts/openapi
          dotnet run --project src/backend/Ogfi.Api/Ogfi.Api.csproj --no-build -c Release --urls http://127.0.0.1:5080 > /tmp/ogfi-api.log 2>&1 &
          API_PID=$!
          trap 'kill ${API_PID} || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5080/openapi/v1.json -o artifacts/openapi/ogfi-v1.json
          test -s artifacts/openapi/ogfi-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ri01-backend
          path: artifacts/backend
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ri01-openapi
          path: artifacts/openapi/ogfi-v1.json
          if-no-files-found: error

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/ogfi-web
    steps:
      - uses: actions/checkout@v4
      - name: Install approved Node.js 24.19.0
        working-directory: .
        run: |
          mkdir -p "${RUNNER_TEMP}/node24"
          curl --fail --location --retry 5 --retry-all-errors \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            -o "${RUNNER_TEMP}/node24.tar.xz"
          tar -xJf "${RUNNER_TEMP}/node24.tar.xz" -C "${RUNNER_TEMP}/node24" --strip-components=1
          echo "${RUNNER_TEMP}/node24/bin" >> "${GITHUB_PATH}"
      - name: Verify approved Node.js version
        run: |
          ACTUAL="$(node --version)"
          echo "Using Node ${ACTUAL}"
          test "${ACTUAL}" = "v24.19.0"
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - uses: actions/download-artifact@v4
        with:
          name: ri01-openapi
          path: artifacts/openapi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate TypeScript API types from controlled OpenAPI artifact
        run: pnpm api:generate
      - name: Build
        run: pnpm build
      - name: Test with JUnit evidence
        run: pnpm exec vitest run --reporter=junit --outputFile=vitest-junit.xml
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri01-frontend-test-evidence
          path: src/frontend/ogfi-web/vitest-junit.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ri01-frontend
          path: src/frontend/ogfi-web/dist
          if-no-files-found: error

  manifest:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate controlled Reference Build Manifest
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REVISION: ${{ github.sha }}
        run: |
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$SOURCE_BRANCH" == batch-g/* ]]; then
            BUILD_BASELINE="RI01-BL07-CANDIDATE"
            ARCHITECTURE_BASELINE="ERP OGFI Master Approved Baseline v5.0 / G9.8"
            ACTIVE_BATCH="G"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260818100110_InventoryMovementTenantRls|Procurement:20260818120100_OutboxConsumerDeliveryRls|Workflow:20260818061100_WorkflowTenantRls|Finance:20260818130100_FinanceTenantRls|Audit:20260818150000_InitialAudit|DurableOperations:20260818160000_InitialDurableOperations"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement","Workflow","Finance","Audit","DurableOperations"]'
          elif [[ "$SOURCE_BRANCH" == batch-f/* ]]; then
            BUILD_BASELINE="RI01-BL06-CANDIDATE"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.8 / G9.7 Implementation Architecture"
            ACTIVE_BATCH="F"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260818100110_InventoryMovementTenantRls|Procurement:20260818120100_OutboxConsumerDeliveryRls|Workflow:20260818061100_WorkflowTenantRls|Finance:20260818130100_FinanceTenantRls"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement","Workflow","Finance"]'
          elif [[ "$SOURCE_BRANCH" == batch-e/* ]]; then
            BUILD_BASELINE="RI01-BL05-CANDIDATE"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.6 / G9.6 Implementation Architecture"
            ACTIVE_BATCH="E"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260818100110_InventoryMovementTenantRls|Procurement:20260818100100_GoodsReceiptTenantRls|Workflow:20260818061100_WorkflowTenantRls"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement","Workflow"]'
          elif [[ "$SOURCE_BRANCH" == batch-d/* ]]; then
            BUILD_BASELINE="RI01-BL04-CANDIDATE"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.4 / G9.5 Implementation Architecture"
            ACTIVE_BATCH="D"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260817141501_InventoryTenantRls|Procurement:20260817142015_SupplierConcurrency|Workflow:20260818061100_WorkflowTenantRls"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement","Workflow"]'
          elif [[ "$SOURCE_BRANCH" == batch-c/* ]]; then
            BUILD_BASELINE="RI01-BL03-CANDIDATE"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.3 / G9.4"
            ACTIVE_BATCH="C"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260817141501_InventoryTenantRls|Procurement:20260817142015_SupplierConcurrency"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement"]'
          elif [[ "$SOURCE_BRANCH" == batch-b/* ]]; then
            BUILD_BASELINE="RI01-BL02-CANDIDATE"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.1 / G9.2"
            ACTIVE_BATCH="B"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls"
            ENABLED_MODULES='["Foundation"]'
          else
            BUILD_BASELINE="RI01-BL05"
            ARCHITECTURE_BASELINE="OGFI Master Approved Baseline v4.7 / G9.6"
            ACTIVE_BATCH="F"
            SCHEMA_VERSION="Foundation:20260817132100_SecuritySpineRls|Catalog:20260817142008_CatalogItemConcurrency|Inventory:20260818100110_InventoryMovementTenantRls|Procurement:20260818100100_GoodsReceiptTenantRls|Workflow:20260818061100_WorkflowTenantRls"
            ENABLED_MODULES='["Foundation","Catalog","Inventory","Procurement","Workflow"]'
          fi
          cat > RI01-build-manifest.json <<EOF
          {
            "referenceImplementationId": "RI-01",
            "buildBaselineId": "${BUILD_BASELINE}",
            "architectureBaseline": "${ARCHITECTURE_BASELINE}",
            "sourceRevision": "${SOURCE_REVISION}",
            "checkoutRevision": "${CHECKOUT_REVISION}",
            "sourceBranch": "${SOURCE_BRANCH}",
            "githubRunId": "${GITHUB_RUN_ID}",
            "backendSdk": ".NET SDK 10.0.400",
            "backendPackages": "ASP.NET Core/EF Core 10.x; Npgsql EF 10.x",
            "frontendToolchain": "Node 24.19.0 / pnpm 11.18.0 / React 19.2 / Vite 8 / TypeScript 5.9.3",
            "apiClientGeneration": "ASP.NET OpenAPI -> openapi-typescript 7.13 -> openapi-fetch 0.17",
            "database": "PostgreSQL 18",
            "schemaVersion": "${SCHEMA_VERSION}",
            "configurationBaseline": "RI01-CFG-INITIAL",
            "enabledModules": ${ENABLED_MODULES},
            "activeBatch": "${ACTIVE_BATCH}",
            "status": "IN_IMPLEMENTATION",
            "knownExceptions": []
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ri01-reference-build-manifest
          path: RI01-build-manifest.json
          if-no-files-found: error
