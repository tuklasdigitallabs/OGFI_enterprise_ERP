services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ogfi
      POSTGRES_USER: ogfi
      POSTGRES_PASSWORD: ogfi_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogfi -d ogfi"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ogfi-postgres:/var/lib/postgresql

volumes:
  ogfi-postgres:
